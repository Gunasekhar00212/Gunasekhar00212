<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="Neuro, an AI assistant shown as a glowing holographic core, introduces Guna Sekhar: an aspiring AI engineer learning PyTorch and building commitMind.ai">
<defs>
<radialGradient id="o" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#9be7ff"/><stop offset="1" stop-color="#36BCF7"/></radialGradient>
<filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:17px;fill:#e6edf3}
.s{transform-box:fill-box;transform-origin:center}
.m{opacity:0;animation-duration:22.5s;animation-iteration-count:infinite}
.m.f{opacity:1}
@keyframes show{0%{opacity:0;transform:translateY(6px)}3%,17%{opacity:1;transform:none}20%,100%{opacity:0}}
@keyframes show0{0%,17%{opacity:1;transform:none}20%,100%{opacity:0}}
.d{fill:#8b949e;opacity:.35;animation:dot 22.5s infinite}
@keyframes dot{0%,19%{opacity:1}20%,100%{opacity:.35}}
.r1{animation:spin 16s linear infinite}.r2{animation:spin 11s linear infinite reverse}.r3{animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.core{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.14)}}
.halo{animation:halo 2.4s ease-in-out infinite}
@keyframes halo{50%{opacity:.45}}
.w{fill:#36BCF7;transform-box:fill-box;transform-origin:50% 100%;animation:wave 1s ease-in-out infinite}
@keyframes wave{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.scan{animation:scan 4s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateY(0);opacity:0}10%,90%{opacity:.25}50%{transform:translateY(150px)}}
</style>
<circle cx="110" cy="112" r="44" fill="#36BCF7" opacity=".9" filter="url(#g)" class="s halo"/>
<g fill="none" stroke="#36BCF7" stroke-linecap="round">
 <g class="s r1"><circle cx="110" cy="112" r="84" stroke-width="2.5" stroke-dasharray="3 9 60 9"/><circle cx="194" cy="112" r="5" fill="#9be7ff" stroke="none"/></g>
 <g class="s r2"><circle cx="110" cy="112" r="68" stroke-width="3" stroke-dasharray="110 22 14 22"/></g>
 <g class="s r3"><circle cx="110" cy="112" r="52" stroke-width="1.5" stroke-dasharray="2 7"/></g>
</g>
<circle cx="110" cy="112" r="30" fill="url(#o)" class="s core"/>
<g><rect x="68" y="212" width="7" height="28" rx="3.5" class="w" style="animation-delay:0.00s"/><rect x="82" y="212" width="7" height="28" rx="3.5" class="w" style="animation-delay:0.17s"/><rect x="96" y="212" width="7" height="28" rx="3.5" class="w" style="animation-delay:0.34s"/><rect x="110" y="212" width="7" height="28" rx="3.5" class="w" style="animation-delay:0.51s"/><rect x="124" y="212" width="7" height="28" rx="3.5" class="w" style="animation-delay:0.68s"/><rect x="138" y="212" width="7" height="28" rx="3.5" class="w" style="animation-delay:0.85s"/><rect x="152" y="212" width="7" height="28" rx="3.5" class="w" style="animation-delay:0.02s"/></g>
<rect x="232" y="30" width="546" height="188" rx="10" fill="#0d1b2a" fill-opacity=".85" stroke="#1f3a52" stroke-width="1.5"/>
<g fill="none" stroke="#36BCF7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M254 30 H232 V52"/><path d="M756 30 H778 V52"/><path d="M254 218 H232 V196"/><path d="M756 218 H778 V196"/></g>
<rect x="246" y="36" width="518" height="2" fill="#36BCF7" class="scan"/>
<g class="m f" style="animation-delay:0.0s;animation-name:show0"><text x="272" y="88">Hello! I'm Neuro, an AI assistant.</text><text x="272" y="118">Allow me to introduce the human who</text><text x="272" y="148">built this profile.</text></g><g class="m" style="animation-delay:4.5s;animation-name:show"><text x="272" y="88">This is Guna Sekhar, a 4th-year AI &amp; Data</text><text x="272" y="118">Science student on the path to</text><text x="272" y="148">becoming an AI Engineer.</text></g><g class="m" style="animation-delay:9.0s;animation-name:show"><text x="272" y="88">He practises AI engineering every day</text><text x="272" y="118">and is learning PyTorch, one tensor</text><text x="272" y="148">at a time.</text></g><g class="m" style="animation-delay:13.5s;animation-name:show"><text x="272" y="88">Right now he is building commitMind.ai:</text><text x="272" y="118">a model that learns to write commit</text><text x="272" y="148">messages from code diffs.</text></g><g class="m" style="animation-delay:18.0s;animation-name:show"><text x="272" y="88">Also built: GradEngine, an EV battery</text><text x="272" y="118">forecaster, quantum ML fraud detection.</text><text x="272" y="148">Scroll down to see them all.</text></g>
<circle cx="700" cy="200" r="3.5" class="d" style="animation-delay:0.0s"/><circle cx="714" cy="200" r="3.5" class="d" style="animation-delay:4.5s"/><circle cx="728" cy="200" r="3.5" class="d" style="animation-delay:9.0s"/><circle cx="742" cy="200" r="3.5" class="d" style="animation-delay:13.5s"/><circle cx="756" cy="200" r="3.5" class="d" style="animation-delay:18.0s"/>
</svg>
