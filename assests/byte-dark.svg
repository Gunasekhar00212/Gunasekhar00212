<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="Byte, an AI robot, introduces Guna Sekhar: an aspiring AI engineer learning PyTorch and building commitMind.ai">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:17px;fill:#e6edf3}
.m{opacity:0;animation-duration:22.5s;animation-iteration-count:infinite}
@keyframes show{0%{opacity:0;transform:translateY(6px)}3%,17%{opacity:1;transform:none}20%,100%{opacity:0}}
@keyframes show0{0%,17%{opacity:1;transform:none}20%,100%{opacity:0}}
.d{fill:#8b949e;opacity:.35;animation:dot 22.5s infinite}
@keyframes dot{0%,19%{opacity:1}20%,100%{opacity:.35}}
.eye{fill:#36BCF7;transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.led{fill:#36BCF7;animation:led 1.6s infinite}
@keyframes led{50%{opacity:.25}}
.bot{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.m.f{opacity:1}
</style>
<g class="bot">
  <line x1="110" y1="28" x2="110" y2="52" stroke="#36BCF7" stroke-width="4" stroke-linecap="round"/>
  <circle cx="110" cy="24" r="7" class="led"/>
  <rect x="50" y="52" width="120" height="96" rx="26" fill="#1b2538" stroke="#36BCF7" stroke-width="4"/>
  <ellipse cx="84" cy="94" rx="10" ry="12" class="eye"/>
  <ellipse cx="136" cy="94" rx="10" ry="12" class="eye"/>
  <path d="M90 124 Q110 138 130 124" fill="none" stroke="#36BCF7" stroke-width="4" stroke-linecap="round"/>
  <rect x="62" y="158" width="96" height="62" rx="18" fill="#1b2538" stroke="#36BCF7" stroke-width="4"/>
  <text x="110" y="196" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#36BCF7">&lt;/AI&gt;</text>
  <rect x="34" y="92" width="12" height="30" rx="6" fill="#36BCF7"/>
  <rect x="174" y="92" width="12" height="30" rx="6" fill="#36BCF7"/>
</g>
<path d="M262 30 H770 a14 14 0 0 1 14 14 V206 a14 14 0 0 1 -14 14 H262 a14 14 0 0 1 -14 -14 V120 L214 104 L248 90 V44 a14 14 0 0 1 14 -14 Z" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<g class="m f" style="animation-delay:0.0s;animation-name:show0"><text x="290" y="88" class="t h">Hi there! I'm Byte, an AI sidekick.</text><text x="290" y="118" class="t">Let me introduce the human who</text><text x="290" y="148" class="t">built this profile.</text></g><g class="m" style="animation-delay:4.5s;animation-name:show"><text x="290" y="88" class="t">This is Guna Sekhar, a 4th-year AI &amp; Data</text><text x="290" y="118" class="t">Science student on the path to</text><text x="290" y="148" class="t">becoming an AI Engineer.</text></g><g class="m" style="animation-delay:9.0s;animation-name:show"><text x="290" y="88" class="t">He practises AI engineering every day</text><text x="290" y="118" class="t">and is learning PyTorch, one tensor</text><text x="290" y="148" class="t">at a time.</text></g><g class="m" style="animation-delay:13.5s;animation-name:show"><text x="290" y="88" class="t">Right now he is building commitMind.ai:</text><text x="290" y="118" class="t">a model that learns to write commit</text><text x="290" y="148" class="t">messages from code diffs.</text></g><g class="m" style="animation-delay:18.0s;animation-name:show"><text x="290" y="88" class="t">Also built: GradEngine, an EV battery</text><text x="290" y="118" class="t">forecaster, quantum ML fraud detection.</text><text x="290" y="148" class="t">Scroll down to see them all.</text></g>
<circle cx="650" cy="228" r="3.5" class="d" style="animation-delay:0.0s"/><circle cx="664" cy="228" r="3.5" class="d" style="animation-delay:4.5s"/><circle cx="678" cy="228" r="3.5" class="d" style="animation-delay:9.0s"/><circle cx="692" cy="228" r="3.5" class="d" style="animation-delay:13.5s"/><circle cx="706" cy="228" r="3.5" class="d" style="animation-delay:18.0s"/>
</svg>
